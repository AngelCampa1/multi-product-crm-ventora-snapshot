<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ventora CRM Widget Smoke Fixture</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: #475569;
      }

      .fixture-host {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ventora CRM widget smoke fixture</h1>
      <p>
        This page loads the production CRM widget loader and renders whatever real approved
        CAMAudit testimonials are available.
      </p>
      <section class="fixture-host" aria-label="Wall grid widget smoke target">
        <!-- Replace data-product with the current widget key from Settings before
             using this fixture against production. Do not commit live keys here. -->
        <script
          src="https://widgets.ventoralabs.com/w/v1.js"
          data-product="REPLACE_WITH_CAMAUDIT_WIDGET_KEY"
          data-widget="wall-grid"
          async></script>
      </section>
    </main>
  </body>
</html>
